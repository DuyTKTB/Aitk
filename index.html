<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A7 K60 DTA — Bảng tuần hoàn tương tác, trợ lý AI Hóa học, Pomodoro, đếm ngược kỳ thi và tính điểm." />
    <meta name="theme-color" content="#030618" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f6ff" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="A7 K60 DTA — Học Hóa học thông minh hơn" />
    <meta property="og:description" content="Bảng tuần hoàn 118 nguyên tố, trợ lý AI, cân bằng PTHH, quiz và trò chơi." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="/img/logo.png" />

    <!-- Font: nạp bằng <link> (nhanh hơn @import trong CSS, đủ subset tiếng Việt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />

    <!-- Áp theme trước khi React chạy để không bị nháy sáng/tối -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('cs-theme-v2');
          var t = v ? JSON.parse(v) : 'dark';
          document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
    <title>A7 K60 DTA — bycode Duy TK</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
