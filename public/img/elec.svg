<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" role="img" aria-label="Elec - linh vật ELEC AI">
<defs>
  <radialGradient id="iris" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#6cb4ff"/><stop offset="1" stop-color="#0a5fd6"/></radialGradient>
  <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#f3f8ff"/><stop offset="1" stop-color="#d9e9ff"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b9bff"/><stop offset="1" stop-color="#0a6ae6"/></linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f86f5"/><stop offset="1" stop-color="#0d4fc9"/></linearGradient>
  <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe8ff"/><stop offset="1" stop-color="#2fb6f5"/></linearGradient>
  <clipPath id="hc"><ellipse cx="320" cy="270" rx="215" ry="185"/></clipPath>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<g stroke-linejoin="round" stroke-linecap="round">

<!-- orbit + electrons -->
<g fill="none" stroke="#9cc8ff" stroke-width="4" stroke-dasharray="2 12" opacity=".9">
  <ellipse cx="320" cy="330" rx="300" ry="120" transform="rotate(-18 320 330)"/>
</g>
<circle cx="52" cy="392" r="11" fill="#ffc21a" stroke="#e39a00" stroke-width="3"/>
<circle cx="590" cy="268" r="9" fill="#ffc21a" stroke="#e39a00" stroke-width="3"/>
<path d="M560,96 l7,18 18,7 -18,7 -7,18 -7,-18 -18,-7 18,-7z" fill="#ffd45e"/>
<path d="M70,250 l5,13 13,5 -13,5 -5,13 -5,-13 -13,-5 13,-5z" fill="#9cc8ff"/>

<!-- ground shadow -->
<ellipse cx="320" cy="706" rx="150" ry="16" fill="#8fb4ea" opacity=".45" filter="url(#soft)"/>

<!-- bubble -->
<g transform="translate(540 96) scale(.82)">
  <path d="M-86,0 C-86,-52 -44,-70 6,-70 C58,-70 92,-46 88,0 C84,42 52,58 14,56 L-4,86 L-18,52 C-60,46 -86,30 -86,0Z" fill="#fff" stroke="#1d4fb8" stroke-width="4"/>
  <g transform="translate(0 -4)"><text y="12" text-anchor="middle" font-family="Poppins, Nunito, 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="800" font-size="30" fill="#0a74ee">Chào!</text></g>
</g>

<!-- legs & shoes -->
<g>
  <path d="M276,586 Q276,650 282,672 L322,672 Q324,640 322,590Z" fill="#0f64dc" stroke="#1d4fb8" stroke-width="4"/>
  <path d="M318,590 Q316,640 318,672 L360,672 Q366,650 364,586Z" fill="#0f64dc" stroke="#1d4fb8" stroke-width="4"/>
  <path d="M250,690 Q250,660 290,660 L322,660 Q330,664 330,684 Q330,708 292,708 Q250,708 250,690Z" fill="#fff" stroke="#1d4fb8" stroke-width="4"/>
  <path d="M312,684 Q312,660 330,660 L352,660 Q392,660 392,690 Q392,708 350,708 Q312,708 312,684Z" fill="#fff" stroke="#1d4fb8" stroke-width="4"/>
  <path d="M256,698 Q290,708 326,698 M318,698 Q352,708 388,698" fill="none" stroke="#9cc8ff" stroke-width="4"/>
</g>

<!-- torso -->
<g>
  <path d="M250,438 Q320,420 390,438 Q412,520 392,596 Q320,616 248,596 Q228,520 250,438Z" fill="url(#blue)" stroke="#1d4fb8" stroke-width="4"/>
  <path d="M284,436 Q320,470 356,436" fill="#fff" stroke="#1d4fb8" stroke-width="3.5"/>
  <path d="M332,486 L298,540 L320,540 L310,580 L348,524 L326,524 Z" fill="#ffc21a" stroke="#d98f00" stroke-width="3.5"/>
  <path d="M258,590 Q320,612 384,590" fill="none" stroke="#0a54c0" stroke-width="4" opacity=".5"/>
</g>

<!-- right arm + flask -->
<g>
  <path d="M384,470 Q430,480 438,530" fill="none" stroke="#1d4fb8" stroke-width="48"/>
  <path d="M384,470 Q430,480 438,530" fill="none" stroke="#2a8cf5" stroke-width="40"/>
</g>

<!-- head -->
<g>
  <ellipse cx="320" cy="270" rx="215" ry="185" fill="url(#head)" stroke="#1d4fb8" stroke-width="4.5"/>
  <!-- hair: soft lobes -->
  <g fill="url(#hair)" stroke="#1d4fb8" stroke-width="4">
    <ellipse cx="250" cy="96" rx="42" ry="64" transform="rotate(-28 250 96)"/>
    <ellipse cx="400" cy="100" rx="40" ry="60" transform="rotate(30 400 100)"/>
    <ellipse cx="324" cy="70" rx="44" ry="70" transform="rotate(4 324 70)"/>
    <path d="M168,200 Q180,120 320,112 Q460,120 472,200 Z"/>
  </g>
  <ellipse cx="306" cy="52" rx="10" ry="22" transform="rotate(8 306 52)" fill="#fff" opacity=".35"/>
  <!-- headband -->
  <g clip-path="url(#hc)">
    <path d="M90,176 Q320,146 550,172 L552,238 Q320,214 88,244 Z" fill="url(#blue)" stroke="#1d4fb8" stroke-width="4"/>
    <path d="M90,166 Q320,136 550,162 L550,176 Q320,150 90,180Z" fill="#fff" opacity=".18"/>
  </g>
  <text x="320" y="219" text-anchor="middle" transform="rotate(-1.2 320 205)" font-family="Poppins, Nunito, 'Arial Rounded MT Bold', Arial, sans-serif" font-weight="800" font-size="40" fill="#fff" letter-spacing="2">ELEC AI</text>
  <!-- cheeks -->
  <ellipse cx="186" cy="354" rx="34" ry="21" fill="#ffa8bd" opacity=".7"/>
  <ellipse cx="454" cy="354" rx="34" ry="21" fill="#ffa8bd" opacity=".7"/>
  <g><ellipse cx="250" cy="312" rx="33" ry="38" fill="url(#iris)"/>
      <ellipse cx="253" cy="318" rx="19" ry="23" fill="#13306b"/>
      <circle cx="241" cy="298" r="11" fill="#fff"/><circle cx="262" cy="330" r="5.5" fill="#fff"/><circle cx="264" cy="304" r="3" fill="#fff" opacity=".8"/></g><g><ellipse cx="390" cy="312" rx="33" ry="38" fill="url(#iris)"/>
      <ellipse cx="393" cy="318" rx="19" ry="23" fill="#13306b"/>
      <circle cx="381" cy="298" r="11" fill="#fff"/><circle cx="402" cy="330" r="5.5" fill="#fff"/><circle cx="404" cy="304" r="3" fill="#fff" opacity=".8"/></g>
  <clipPath id="mc"><path d="M290,346 Q320,338 350,346 Q348,390 320,390 Q292,390 290,346Z"/></clipPath>
        <path d="M290,346 Q320,338 350,346 Q348,390 320,390 Q292,390 290,346Z" fill="#b02a47"/>
        <g clip-path="url(#mc)"><ellipse cx="320" cy="392" rx="22" ry="15" fill="#ff8aa0"/></g>
        <path d="M290,346 Q320,338 350,346 Q348,390 320,390 Q292,390 290,346Z" fill="none" stroke="#7d1d33" stroke-width="3.5" stroke-linejoin="round"/>
</g>

<!-- flask in hand -->
<g>
  <g transform="translate(408 424)">
    <path d="M30,0 L30,44 L-4,96 Q-12,118 12,118 L80,118 Q104,118 96,96 L62,44 L62,0Z" fill="#f2fbff" fill-opacity=".9" stroke="#1d4fb8" stroke-width="4"/>
    <path d="M2,86 Q46,70 92,86 L96,100 Q104,116 80,116 L12,116 Q-12,116 -2,100Z" fill="url(#liq)"/>
    <rect x="24" y="-8" width="44" height="14" rx="7" fill="#fff" stroke="#1d4fb8" stroke-width="4"/>
    <circle cx="32" cy="100" r="5" fill="#fff" opacity=".9"/><circle cx="58" cy="92" r="4" fill="#fff" opacity=".9"/>
    <circle cx="48" cy="-30" r="8" fill="#a8ecff" stroke="#1d4fb8" stroke-width="3"/><circle cx="62" cy="-52" r="5" fill="#a8ecff" stroke="#1d4fb8" stroke-width="3"/>
  </g>
  <circle cx="454" cy="540" r="27" fill="#fff" stroke="#1d4fb8" stroke-width="4"/>
</g>

<!-- left arm waving -->
<g>
  <path d="M262,474 Q196,486 160,440" fill="none" stroke="#1d4fb8" stroke-width="48"/>
  <path d="M262,474 Q196,486 160,440" fill="none" stroke="#2a8cf5" stroke-width="40"/>
  <circle cx="146" cy="418" r="30" fill="#fff" stroke="#1d4fb8" stroke-width="4"/>
  <ellipse cx="124" cy="404" rx="11" ry="15" transform="rotate(-30 124 404)" fill="#fff" stroke="#1d4fb8" stroke-width="4"/>
  <circle cx="146" cy="418" r="26" fill="#fff"/>
</g>

</g>
</svg>